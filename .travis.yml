before_install:
  - sudo apt-get update
  - sudo apt-get install libgl1-mesa-dev
  - export CHROME_BIN=chromium-browser
  - "export DISPLAY=:99.0"
  - "sh -e /etc/init.d/xvfb start"
  - sleep 3 # give xvfb some time to start

before_script:
  - npm install -g bower
  - bower install -f

sudo: required
language: node_js
node_js:
  - stable
